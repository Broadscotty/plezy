name: Test Build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android
        default: true
        type: boolean
      branch:
        description: Branch to build
        default: 'vibe/refactor-stremio-downloads-d1e9ab'
        type: string

jobs:
  build-android:
    name: Build Android Test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.22.0
          echo "$PWD/flutter/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=ENABLE_UPDATE_CHECK=true

      - name: Upload APKs
        uses: actions/upload-artifact@v3
        with:
          name: test-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7